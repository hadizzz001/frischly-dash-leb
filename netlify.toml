{
  "build": {
    "publish": "public"
  },
  "redirects": [
    {
      "from": "/api/*",
      "to": "https://your-backend-url.com/api/:splat",
      "status": 200,
      "force": true
    },
    {
      "from": "/*",
      "to": "/index.html",
      "status": 200
    }
  ],
  "headers": [
    {
      "for": "/*",
      "values": {
        "X-Frame-Options": "DENY",
        "X-Content-Type-Options": "nosniff"
      }
    }
  ]
}