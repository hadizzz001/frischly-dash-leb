{
  "build": {
    "publish": "public"
  },
  "redirects": [
    {
      "from": "/api/*",
      "to": "https://frischly-server.onrender.com/api/:splat",
      "status": 200,
      "force": true
    },
    {
      "from": "/*",
      "to": "/index.html",
      "status": 200
    }
  ],
  "headers": [
    {
      "for": "/*",
      "values": {
        "X-Frame-Options": "DENY",
        "X-Content-Type-Options": "nosniff",
        "Content-Security-Policy": "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' http://localhost:* https://localhost:* https://frischly-server.onrender.com https://frischlyshop-server.onrender.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://cdnjs.cloudflare.com;"
      }
    }
  ]
}