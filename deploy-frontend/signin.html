<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign In - FRISCHLY Server</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: #000000;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.container {
				background: #ffffff;
				border-radius: 15px;
				box-shadow: 0 15px 35px rgba(255, 195, 0, 0.3);
				overflow: hidden;
				width: 400px;
				max-width: 90vw;
				padding: 40px;
				border: 3px solid #ffc300;
			}

			.header {
				text-align: center;
				margin-bottom: 30px;
			}

			.header h1 {
				color: #ffc300;
				margin-bottom: 10px;
				font-size: 28px;
			}

			.header p {
				color: #000000;
				font-size: 16px;
			}

			.form-group {
				margin-bottom: 20px;
			}

			.form-group label {
				display: block;
				margin-bottom: 5px;
				color: #000000;
				font-weight: 500;
			}

			.form-group input {
				width: 100%;
				padding: 12px;
				border: 2px solid #ffc300;
				border-radius: 8px;
				font-size: 14px;
				transition: border-color 0.3s ease;
				background: #ffffff;
				color: #000000;
			}

			.form-group input:focus {
				outline: none;
				border-color: #000000;
			}

			.btn {
				width: 100%;
				padding: 12px;
				background: #ffc300;
				color: #000000;
				border: 2px solid #ffc300;
				border-radius: 8px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s ease;
				margin-bottom: 20px;
			}

			.btn:hover {
				transform: translateY(-2px);
			}

			.btn:disabled {
				opacity: 0.6;
				cursor: not-allowed;
				transform: none;
			}

			.message {
				margin-bottom: 20px;
				padding: 10px;
				border-radius: 8px;
				font-size: 14px;
			}

			.success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f1b0b7;
			}

			.loading {
				display: none;
				text-align: center;
				margin: 20px 0;
			}

			.spinner {
				border: 4px solid #f3f3f3;
				border-top: 4px solid #ffc300;
				border-radius: 50%;
				width: 30px;
				height: 30px;
				animation: spin 1s linear infinite;
				margin: 0 auto;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.links {
				text-align: center;
				margin-top: 20px;
			}

			.links a {
				color: #ffc300;
				text-decoration: none;
				font-weight: 500;
			}

			.links a:hover {
				text-decoration: underline;
			}

			.divider {
				margin: 20px 0;
				text-align: center;
				color: #666;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>Welcome Back</h1>
				<p>Sign in to your account</p>
			</div>

			<div id="message"></div>
			<div class="loading" id="loading">
				<div class="spinner"></div>
				<p>Signing you in...</p>
			</div>

			<form id="signin-form">
				<div class="form-group">
					<label for="email">Email Address</label>
					<input
						type="email"
						id="email"
						name="email"
						required
						placeholder="Enter your email"
					/>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input
						type="password"
						id="password"
						name="password"
						required
						placeholder="Enter your password"
					/>
				</div>

				<button type="submit" class="btn">Sign In</button>
			</form>

			<div class="divider">─────── or ───────</div>

			<div class="links">
				<p>Don't have an account? <a href="signup.html">Sign up here</a></p>
				<p><a href="index.html">← Back to Home</a></p>
			</div>
		</div>

		<script>
			const API_BASE_URL = "http://localhost:3001/api";

			// Define helper functions first
			function showMessage(message, type) {
				const messageDiv = document.getElementById("message");
				if (messageDiv) {
					messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
				}
			}

			function clearMessage() {
				const messageDiv = document.getElementById("message");
				if (messageDiv) {
					messageDiv.innerHTML = "";
				}
			}

			function showLoading(show) {
				const loadingDiv = document.getElementById("loading");
				if (loadingDiv) {
					loadingDiv.style.display = show ? "block" : "none";
				}
				const btn = document.querySelector(".btn");
				if (btn) {
					btn.disabled = show;
				}
			}

			// Sign out function for users who are already logged in - Define globally first
			function signOut() {
				localStorage.removeItem("authToken");

				// Try to show message directly in the DOM
				const messageDiv = document.getElementById("message");
				if (messageDiv) {
					messageDiv.innerHTML = `<div class="message success">✅ Signed out successfully! Reloading page...</div>`;
					setTimeout(() => {
						location.reload();
					}, 1500);
				} else {
					// If no message div, reload immediately
					location.reload();
				}
			}

			// Check if user is already logged in
			const currentToken = localStorage.getItem("authToken");
			if (currentToken) {
				// Show option to sign out or go to dashboard
				document.querySelector(".container").innerHTML = `
					<div class="header">
						<h1>Already Signed In</h1>
						<p>You are currently signed in to your account</p>
					</div>
					<div id="message"></div>
					<div class="message success">
						✅ You're already logged in! Choose an option below:
					</div>
					<div style="text-align: center; margin: 30px 0;">
						<a href="dashboard.html" class="btn" style="margin: 10px; display: inline-block; text-decoration: none;">
							Go to Dashboard
						</a>
						<button onclick="signOut();" class="btn" style="margin: 10px; background: #6c757d;">
							Sign Out & Sign In Different Account
						</button>
					</div>
					<div class="divider">─────── or ───────</div>
					<div class="links">
						<p><a href="signup.html">Need to create an account? Sign up here</a></p>
						<p><a href="index.html">← Back to Home</a></p>
					</div>
				`;
			}

			// Check for signup success message from URL parameters
			document.addEventListener("DOMContentLoaded", function () {
				const urlParams = new URLSearchParams(window.location.search);
				if (urlParams.get("signup") === "success") {
					showMessage(
						"Account created successfully! Please sign in with your credentials.",
						"success"
					);
					// Clean up the URL without refreshing the page
					window.history.replaceState(
						{},
						document.title,
						window.location.pathname
					);
				}
			});

			// Sign In Form Handler
			document
				.getElementById("signin-form")
				.addEventListener("submit", async (e) => {
					e.preventDefault();
					showLoading(true);
					clearMessage();

					const formData = new FormData(e.target);
					const data = {
						email: formData.get("email"),
						password: formData.get("password"),
					};

					try {
						const response = await fetch(`${API_BASE_URL}/auth/login-profile`, {
							method: "POST",
							headers: {
								"Content-Type": "application/json",
							},
							body: JSON.stringify(data),
						});

						const result = await response.json();

						if (response.ok) {
							showMessage("Login successful! Redirecting...", "success");
							localStorage.setItem("authToken", result.data.token);

							// Role-based redirect
							const redirectUrl = result.data.redirectUrl || "profile.html";
							setTimeout(() => {
								window.location.href = redirectUrl;
							}, 1500);
						} else {
							showMessage(
								result.message ||
									"Login failed. Please check your credentials.",
								"error"
							);
						}
					} catch (error) {
						showMessage(
							"Network error. Please check if the server is running.",
							"error"
						);
						console.error("Login error:", error);
					}

					showLoading(false);
				});
		</script>
	</body>
</html>
