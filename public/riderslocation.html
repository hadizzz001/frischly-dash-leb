<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Riders Location - Freshly Server</title>
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="css/dashboard.css" />
			<link rel="stylesheet" href="css/riderslocation-extracted.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="css/admin.css?v=1" />
		<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
		<script src="js/icons.js?v=1"></script>
</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>Riders Live Location</h1>
				<div class="header-actions">
					<button
						onclick="toggleFullscreen()"
						class="fullscreen-btn"
						id="fullscreenBtn"
					>
						<i data-lucide=maximize></i> Fullscreen
					</button>
					<a href="dashboard.html" class="back-btn"><i data-lucide=arrow-left></i> Back to Dashboard</a>
				</div>
			</div>

			<div id="loading" class="rlx-1">
				<div class="spinner"></div>
				<p>Loading riders locations...</p>
			</div>

			<div id="riders-grid" class="riders-grid">
				<!-- Riders will be loaded here -->
			</div>
		</div>

		<script src="js/config.js"></script>
		<script src="js/page-riderslocation.js"></script>
	</body>
</html>
