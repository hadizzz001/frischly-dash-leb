<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Delivery Coverage Regions — Freshly.lb</title>
	<!-- Exact same map stack (OpenLayers + the shared multi-pin widget) used
	     by the main admin's Markets Management page, so the market owner
	     gets the identical, proven-working component — not a hand-copied
	     clone that can drift out of sync or reintroduce bugs. -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
	<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
	<script src="js/region-map-picker.js?v=2"></script>
	<link rel="stylesheet" href="css/profile-map.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="css/admin.css?v=1" />
		<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
		<script src="js/icons.js?v=1"></script>
</head>
<body>
	<div class="bar">
		<div>
			<h1><i data-lucide=map-pin></i> Delivery Coverage Regions</h1>
			<p>Click the map to drop a pin — add as many as you need. Drag a pin's round center to move it, drag its square handle to resize the coverage circle, and click the red × to remove one.</p>
		</div>
		<button class="btn secondary" onclick="closeMe()">Close</button>
	</div>
	<div id="map"></div>
	<div class="footer">
		<button class="btn secondary" onclick="closeMe()">Cancel</button>
		<button class="btn" onclick="submitRegions()">Save</button>
	</div>
	<div class="toast" id="toast"></div>

	<script src="js/config.js"></script>
	<script src="js/page-market-profile-map.js"></script>
</body>
</html>
