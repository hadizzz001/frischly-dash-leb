<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign Up - FRISCHLY Server</title>

		<!-- Favicon -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="icons/favicon_16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="icons/favicon_32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="icons/favicon_48x48.png"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: #ffffff;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px 0;
			}

			.container {
				background: #ffffff;
				border-radius: 15px;
				box-shadow: 0 15px 35px rgba(255, 195, 0, 0.3);
				width: 500px;
				max-width: 95vw;
				padding: 40px;
				margin: 20px 0;
				border: 3px solid #ffc300;
			}

			.header {
				text-align: center;
				margin-bottom: 30px;
			}

			.header h1 {
				color: #ffc300;
				margin-bottom: 10px;
				font-size: 28px;
			}

			.header p {
				color: #000000;
				font-size: 16px;
			}

			.form-group {
				margin-bottom: 20px;
			}

			.form-group label {
				display: block;
				margin-bottom: 5px;
				color: #000000;
				font-weight: 500;
			}

			.form-group input {
				width: 100%;
				padding: 12px;
				border: 2px solid #ffc300;
				border-radius: 8px;
				font-size: 14px;
				transition: border-color 0.3s ease;
				background: #ffffff;
				color: #000000;
			}

			.form-group input:focus {
				outline: none;
				border-color: #000000;
			}

			.form-group select {
				width: 100%;
				padding: 12px;
				border: 2px solid #ffc300;
				border-radius: 8px;
				font-size: 14px;
				transition: border-color 0.3s ease;
				background: #ffffff;
				color: #000000;
				cursor: pointer;
			}

			.form-group select:focus {
				outline: none;
				border-color: #000000;
			}

			.address-section {
				background: rgba(255, 195, 0, 0.1);
				padding: 25px;
				border-radius: 10px;
				margin-bottom: 25px;
				border: 2px solid #ffc300;
			}

			.address-section h3 {
				color: #000000;
				margin-bottom: 20px;
				font-size: 18px;
				font-weight: 600;
				display: flex;
				align-items: center;
			}

			.address-section h3::before {
				content: "📍";
				margin-right: 8px;
				font-size: 16px;
			}

			.address-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
			}

			.address-grid .full-width {
				grid-column: 1 / -1;
			}

			.address-grid .form-group {
				margin-bottom: 0;
			}

			.address-grid input {
				background: white;
				border: 2px solid #dee2e6;
			}

			.address-grid input:focus {
				border-color: #667eea;
				box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
			}

			@media (max-width: 600px) {
				.address-grid {
					grid-template-columns: 1fr;
					gap: 15px;
				}

				.address-grid .full-width {
					grid-column: 1;
				}
			}

			.btn {
				width: 100%;
				padding: 12px;
				background: #ffc300;
				color: #000000;
				border: 2px solid #ffc300;
				border-radius: 8px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s ease;
				margin-bottom: 20px;
			}

			.btn:hover {
				transform: translateY(-2px);
			}

			.btn:disabled {
				opacity: 0.6;
				cursor: not-allowed;
				transform: none;
			}

			.message {
				margin-bottom: 20px;
				padding: 10px;
				border-radius: 8px;
				font-size: 14px;
			}

			.success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f1b0b7;
			}

			.loading {
				display: none;
				text-align: center;
				margin: 20px 0;
			}

			.spinner {
				border: 4px solid #f3f3f3;
				border-top: 4px solid #667eea;
				border-radius: 50%;
				width: 30px;
				height: 30px;
				animation: spin 1s linear infinite;
				margin: 0 auto;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.links {
				text-align: center;
				margin-top: 20px;
			}

			.links a {
				color: #667eea;
				text-decoration: none;
				font-weight: 500;
			}

			.links a:hover {
				text-decoration: underline;
			}

			.divider {
				margin: 20px 0;
				text-align: center;
				color: #666;
			}

			.password-requirements {
				font-size: 12px;
				color: #666;
				margin-top: 5px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>Sign Up</h1>
				<p>Create your FRISCHLY account</p>
			</div>

			<div id="message"></div>
			<div
				id="loading"
				style="display: none; text-align: center; margin: 20px 0"
			>
				<div style="font-size: 24px">⏳</div>
				<p>Creating your account...</p>
			</div>

			<!-- Signup Form -->
			<form id="signup-form">
				<div class="form-group">
					<label for="name">Full Name</label>
					<input
						type="text"
						id="name"
						name="name"
						required
						placeholder="Enter your full name"
					/>
				</div>

				<div class="form-group">
					<label for="phoneNumber">Phone Number</label>
					<input
						type="tel"
						id="phoneNumber"
						name="phoneNumber"
						required
						placeholder="+1234567890"
					/>
				</div>

				<div class="form-group">
					<label for="email">Email Address</label>
					<input
						type="email"
						id="email"
						name="email"
						required
						placeholder="Enter your email"
					/>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input
						type="password"
						id="password"
						name="password"
						required
						placeholder="Create a strong password"
					/>
					<div class="password-requirements">
						Must contain at least 6 characters with uppercase, lowercase, and
						number
					</div>
				</div>

				<div class="address-section">
					<h3>Address Information</h3>
					<div class="address-grid">
						<div class="form-group full-width">
							<label for="street">Street Address</label>
							<input
								type="text"
								id="street"
								name="street"
								required
								placeholder="123 Main Street"
							/>
						</div>
						<div class="form-group">
							<label for="city">City</label>
							<input
								type="text"
								id="city"
								name="city"
								required
								placeholder="New York"
							/>
						</div>
						<div class="form-group">
							<label for="state">State/Province</label>
							<input
								type="text"
								id="state"
								name="state"
								required
								placeholder="NY"
							/>
						</div>
						<div class="form-group">
							<label for="zipCode">Zip/Postal Code</label>
							<select id="zipCode" name="zipCode" required>
								<option value="">Select Zip Code</option>
								<!-- Zip codes will be loaded dynamically -->
							</select>
						</div>
						<div class="form-group">
							<label for="country">Country</label>
							<input
								type="text"
								id="country"
								name="country"
								value="USA"
								required
							/>
						</div>
					</div>
				</div>

				<button type="submit" class="btn">Create Account</button>
			</form>

			<div class="divider">─────── or ───────</div>

			<div class="links">
				<p>Already have an account? <a href="signin.html">Sign in here</a></p>
				<p><a href="index.html">← Back to Home</a></p>
			</div>
		</div>

		<!-- Global Config -->
		<script src="js/config.js"></script>

		<script>
			// Define helper functions first
			function showMessage(message, type) {
				const messageDiv = document.getElementById("message");
				if (messageDiv) {
					messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
				}
			}

			function clearMessage() {
				const messageDiv = document.getElementById("message");
				if (messageDiv) {
					messageDiv.innerHTML = "";
				}
			}

			function showLoading(show) {
				const loadingDiv = document.getElementById("loading");
				if (loadingDiv) {
					loadingDiv.style.display = show ? "block" : "none";
				}
				const btn = document.querySelector(".btn");
				if (btn) {
					btn.disabled = show;
				}
			}

			// Load zip codes from active zones
			async function loadZipCodes() {
				const zipCodeSelect = document.getElementById("zipCode");
				if (!zipCodeSelect) return;

				try {
					const response = await fetch(`${API_BASE_URL}/zones/active`);
					const data = await response.json();

					if (data.success && data.data) {
						// Clear existing options except the first one
						zipCodeSelect.innerHTML =
							'<option value="">Select Zip Code</option>';

						// Add zip codes from active zones
						data.data.forEach((zone) => {
							const option = document.createElement("option");
							option.value = zone.zipCode;
							option.textContent = `${zone.zipCode} - ${zone.zoneName}`;
							zipCodeSelect.appendChild(option);
						});
					} else {
						console.error("Failed to load zip codes:", data.message);
						// Fallback to text input if API fails
						const container = zipCodeSelect.parentElement;
						container.innerHTML = `
							<label for="zipCode">Zip/Postal Code</label>
							<input type="text" id="zipCode" name="zipCode" required placeholder="10001" style="width: 100%; padding: 12px; border: 2px solid #ffc300; border-radius: 8px; font-size: 14px; background: #ffffff; color: #000000;" />
						`;
					}
				} catch (error) {
					console.error("Error loading zip codes:", error);
					// Fallback to text input if API fails
					const container = zipCodeSelect.parentElement;
					container.innerHTML = `
						<label for="zipCode">Zip/Postal Code</label>
						<input type="text" id="zipCode" name="zipCode" required placeholder="10001" style="width: 100%; padding: 12px; border: 2px solid #ffc300; border-radius: 8px; font-size: 14px; background: #ffffff; color: #000000;" />
					`;
				}
			}

			// Sign out function for users who are already logged in - Define globally first
			function signOut() {
				localStorage.removeItem("authToken");

				// Try to show message directly in the DOM
				const messageDiv = document.getElementById("message");
				if (messageDiv) {
					messageDiv.innerHTML = `<div class="message success">✅ Signed out successfully! Reloading page...</div>`;
					setTimeout(() => {
						location.reload();
					}, 1500);
				} else {
					// If no message div, reload immediately
					location.reload();
				}
			}

			// Check if user is already logged in
			const currentToken = localStorage.getItem("authToken");
			if (currentToken) {
				// Show option to sign out or go to dashboard
				document.querySelector(".container").innerHTML = `
					<div class="header">
						<h1>Already Signed In</h1>
						<p>You are currently signed in to your account</p>
					</div>
					<div id="message"></div>
					<div class="message success">
						✅ You're already logged in! Choose an option below:
					</div>
					<div style="text-align: center; margin: 30px 0;">
						<a href="dashboard.html" class="btn" style="margin: 10px; display: inline-block; text-decoration: none;">
							Go to Dashboard
						</a>
						<button onclick="signOut();" class="btn" style="margin: 10px; background: #6c757d;">
							Sign Out & Create New Account
						</button>
					</div>
					<div class="links">
						<p><a href="index.html">← Back to Home</a></p>
					</div>
				`;
			}

			// Load zip codes when page loads
			document.addEventListener("DOMContentLoaded", function () {
				loadZipCodes();
			});

			// Sign Up Form Handler
			document
				.getElementById("signup-form")
				.addEventListener("submit", async (e) => {
					e.preventDefault();
					showLoading(true);
					clearMessage();

					const formData = new FormData(e.target);
					const data = {
						name: formData.get("name"),
						phoneNumber: formData.get("phoneNumber"),
						email: formData.get("email"),
						password: formData.get("password"),
						address: {
							street: formData.get("street"),
							city: formData.get("city"),
							state: formData.get("state"),
							zipCode: formData.get("zipCode"),
							country: formData.get("country"),
						},
					};

					// Validate required fields
					const requiredFields = ["name", "phoneNumber", "email", "password"];
					const addressFields = [
						"street",
						"city",
						"state",
						"zipCode",
						"country",
					];

					for (let field of requiredFields) {
						if (!data[field] || data[field].trim() === "") {
							showMessage(`${field} is required`, "error");
							showLoading(false);
							return;
						}
					}

					for (let field of addressFields) {
						if (!data.address[field] || data.address[field].trim() === "") {
							showMessage(`Address ${field} is required`, "error");
							showLoading(false);
							return;
						}
					}
					try {
						const response = await fetch(`${API_BASE_URL}/auth/register`, {
							method: "POST",
							headers: {
								"Content-Type": "application/json",
							},
							body: JSON.stringify(data),
						});

						const result = await response.json();

						if (response.ok) {
							showMessage(
								"Account created successfully! Redirecting to sign in...",
								"success"
							);

							// Redirect to signin with success message after short delay
							setTimeout(() => {
								window.location.href = "signin.html?signup=success";
							}, 1500);
						} else {
							if (result.errors && Array.isArray(result.errors)) {
								const errorMessages = result.errors
									.map((err) => err.msg)
									.join("<br>");
								showMessage(errorMessages, "error");
							} else {
								showMessage(
									result.message || "Registration failed. Please try again.",
									"error"
								);
							}
						}
					} catch (error) {
						showMessage(
							"Network error. Please check if the server is running.",
							"error"
						);
						console.error("Registration error:", error);
					}

					showLoading(false);
				});
		</script>
	</body>
</html>
