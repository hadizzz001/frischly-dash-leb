<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign Up - Freshly Server</title>

		<!-- Favicon -->
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="css/global.css" />
		<link rel="stylesheet" href="css/signup.css" />
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>Sign Up</h1>
				<p>Create your Freshly account</p>
			</div>

			<div id="message"></div>
			<div
				id="loading"
				class="loading"
			>
				<div class="loading-icon">⏳</div>
				<p>Creating your account...</p>
			</div>

			<!-- Signup Form -->
			<form id="signup-form">
				<div class="form-group">
					<label for="name">Full Name</label>
					<input
						type="text"
						id="name"
						name="name"
						required
						placeholder="Enter your full name"
					/>
				</div>

				<div class="form-group">
					<label for="phoneNumber">Phone Number</label>
					<input
						type="tel"
						id="phoneNumber"
						name="phoneNumber"
						required
						placeholder="+1234567890"
					/>
				</div>

				<div class="form-group">
					<label for="email">Email Address</label>
					<input
						type="email"
						id="email"
						name="email"
						required
						placeholder="Enter your email"
					/>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<div class="password-wrap">
						<input
							type="password"
							id="password"
							name="password"
							required
							placeholder="Create a strong password"
						/>
						<button
							type="button"
							class="password-toggle"
							onclick="togglePassword(this)"
							aria-label="Show password"
							aria-pressed="false"
						>
							<svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
								<circle cx="12" cy="12" r="3" />
							</svg>
							<svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
								<line x1="1" y1="1" x2="23" y2="23" />
							</svg>
						</button>
					</div>
					<div class="password-requirements">
						Must contain at least 6 characters with uppercase, lowercase, and
						number
					</div>
				</div>

				<div class="address-section">
					<h3>Address Information</h3>
					<div class="address-grid">
						<div class="form-group full-width">
							<label for="street">Street Address</label>
							<input
								type="text"
								id="street"
								name="street"
								required
								placeholder="123 Main Street"
							/>
						</div>
						<div class="form-group">
							<label for="city">City</label>
							<select id="city" name="city" required data-lebanese-city-select></select>
						</div>
					</div>
				</div>

				<button type="submit" class="btn">Create Account</button>
			</form>

			<div class="divider">─────── or ───────</div>

			<div class="links">
				<p>Already have an account? <a href="signin.html">Sign in here</a></p>
				<p><a href="index.html">← Back to Home</a></p>
			</div>
		</div>

		<!-- Global Config -->
		<script src="js/config.js"></script>
		<script src="js/lebanese-cities.js"></script>

		<script src="js/page-signup.js"></script>
	</body>
</html>
