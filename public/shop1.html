<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Freshly Shop - Use Our App</title>

		<!-- Favicon -->
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: linear-gradient(135deg, #ffc300 0%, #ff8c00 100%);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.container {
				background: #ffffff;
				border-radius: 20px;
				box-shadow: 0 20px 40px rgba(255, 195, 0, 0.3);
				text-align: center;
				padding: 60px 40px;
				width: 100%;
				max-width: 600px;
				border: 4px solid #ffc300;
			}

			.logo {
				font-size: 48px;
				margin-bottom: 20px;
			}

			.title {
				color: #ffc300;
				font-size: 36px;
				font-weight: bold;
				margin-bottom: 20px;
			}

			.subtitle {
				color: #333;
				font-size: 20px;
				margin-bottom: 30px;
				line-height: 1.4;
			}

			.message {
				background: rgba(255, 195, 0, 0.1);
				border: 2px solid #ffc300;
				border-radius: 15px;
				padding: 30px;
				margin-bottom: 40px;
			}

			.message h3 {
				color: #000;
				font-size: 24px;
				margin-bottom: 15px;
			}

			.message p {
				color: #555;
				font-size: 16px;
				line-height: 1.6;
				margin-bottom: 20px;
			}

			.features {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 20px;
				margin-bottom: 40px;
			}

			.feature {
				background: #f8f9fa;
				padding: 20px;
				border-radius: 10px;
				border: 2px solid #ffc300;
			}

			.feature-icon {
				font-size: 32px;
				margin-bottom: 10px;
			}

			.feature h4 {
				color: #333;
				font-size: 18px;
				margin-bottom: 10px;
			}

			.feature p {
				color: #666;
				font-size: 14px;
			}

			.app-links {
				margin-bottom: 40px;
			}

			.app-links h3 {
				color: #000;
				font-size: 24px;
				margin-bottom: 20px;
			}

			.app-buttons {
				display: flex;
				gap: 20px;
				justify-content: center;
				flex-wrap: wrap;
			}

			.app-button {
				background: #000;
				color: #ffc300;
				padding: 15px 30px;
				border-radius: 10px;
				text-decoration: none;
				font-weight: bold;
				font-size: 16px;
				display: flex;
				align-items: center;
				gap: 10px;
				transition: transform 0.3s ease;
				border: 2px solid #000;
			}

			.app-button:hover {
				transform: translateY(-3px);
				background: #333;
			}

			.back-link {
				color: #666;
				text-decoration: none;
				font-size: 16px;
				display: inline-block;
				margin-top: 20px;
				padding: 10px 20px;
				border: 2px solid #ddd;
				border-radius: 8px;
				transition: all 0.3s ease;
			}

			.back-link:hover {
				background: #f8f9fa;
				border-color: #ffc300;
				color: #000;
			}

			@media (max-width: 768px) {
				.container {
					padding: 40px 20px;
					margin: 20px;
				}

				.title {
					font-size: 28px;
				}

				.app-buttons {
					flex-direction: column;
					align-items: center;
				}

				.features {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="logo">🛒</div>
			<h1 class="title">Welcome to Freshly Shop</h1>
			<p class="subtitle">Fresh products delivered to your doorstep</p>
			<a href="index.html" class="back-link">← Back to Home</a>
		</div>
	</body>
</html>
