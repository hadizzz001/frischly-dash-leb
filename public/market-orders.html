<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Market Orders — Freshly.lb Admin</title>
	<style>
		:root { --brand: #ffc300; --brand-dark: #e6ad00; --ink: #000000; --muted: #666666; }
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #ffffff; margin: 0; color: var(--ink); }
		.sidebar { width: 250px; background: #ffffff; box-shadow: 2px 0 10px rgba(244, 187, 38, 0.3); height: 100vh; position: fixed; left: 0; top: 0; z-index: 1000; overflow-y: auto; }
		.sidebar-header { background: var(--brand); color: var(--ink); padding: 20px; text-align: center; }
		.sidebar-logo { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
		.sidebar-header h2 { font-size: 20px; margin-bottom: 5px; }
		.sidebar-header p { font-size: 14px; opacity: 0.9; }
		.sidebar-menu { padding: 0; list-style: none; }
		.menu-item { border-bottom: 1px solid #f0f0f0; }
		.menu-item a { display: flex; align-items: center; padding: 15px 20px; color: var(--ink); text-decoration: none; transition: all 0.3s ease; font-weight: 500; }
		.menu-item a:hover, .menu-item.active a { background: var(--brand); color: var(--ink); border-right: 3px solid var(--ink); }
		.menu-icon { margin-right: 12px; font-size: 18px; width: 20px; text-align: center; }
		.main-content { margin-left: 250px; min-height: 100vh; padding: 40px 20px 20px; }
		.container { max-width: 1300px; margin: 0 auto; background: #ffffff; border-radius: 15px; box-shadow: 0 15px 35px rgba(244, 187, 38, 0.2); overflow: hidden; }
		.page-header { background: var(--brand); color: var(--ink); padding: 20px 30px; box-shadow: 0 2px 10px rgba(244, 187, 38, 0.3); }
		.brand-name { font-size: 14px; font-weight: 700; letter-spacing: .2px; margin-bottom: 6px; }
		h1 { margin: 0 0 5px; color: var(--ink); font-size: 24px; }
		.page-header p { margin: 0; color: var(--ink); opacity: 0.9; font-size: 14px; }
		.toolbar { display: flex; justify-content: space-between; align-items: center; margin: 20px 30px 16px; gap: 12px; flex-wrap: wrap; }
		.btn { background: var(--brand); color: var(--ink); border: 2px solid var(--brand); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
		.btn:hover { background: var(--brand-dark); border-color: var(--brand-dark); transform: translateY(-2px); }
		.btn.secondary { background: #ffffff; color: var(--ink); border-color: var(--ink); }
		input, select { padding: 12px; border: 2px solid var(--brand); border-radius: 8px; font-size: 14px; background: #ffffff; color: var(--ink); }
		input:focus, select:focus { outline: none; border-color: var(--ink); }
		#tableWrap { margin: 0 30px 30px; }
		table { width: 100%; background: #ffffff; border: 2px solid var(--brand); border-radius: 10px; overflow: hidden; border-collapse: collapse; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
		th, td { padding: 12px 14px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--brand); vertical-align: middle; }
		th { background: var(--brand); font-weight: 600; color: var(--ink); }
		tr:hover td { background: rgba(244, 187, 38, 0.08); }
		.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
		.badge.pending { background: #fef3c7; color: #92400e; }
		.badge.processing, .badge.confirmed, .badge.preparing { background: #dbeafe; color: #1e40af; }
		.badge.shipped, .badge.in_transit, .badge.outForDelivery, .badge.out-for-delivery { background: #ede9fe; color: #5b21b6; }
		.badge.delivered, .badge.completed { background: #d1fae5; color: #065f46; }
		.badge.cancelled, .badge.canceled, .badge.rejected, .badge.failed { background: #fee2e2; color: #991b1b; }
		.empty { text-align: center; padding: 40px; color: var(--muted); }
		.note { margin: 0 30px 16px; padding: 10px 14px; border-left: 4px solid var(--brand); background: rgba(244,187,38,.08); border-radius: 6px; font-size: 13px; color: var(--ink); }
		.toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: white; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: opacity .25s; z-index: 100; }
		.toast.show { opacity: 1; }
		.toast.error { background: #dc2626; }
		.pagination { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
		.pagination button { background: #fff; border: 2px solid var(--brand); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
		.pagination button[disabled] { opacity: .4; cursor: not-allowed; }
		.pagination button.active { background: var(--brand); }
		@media (max-width: 900px) {
			.sidebar { position: static; width: 100%; height: auto; }
			.main-content { margin-left: 0; padding: 16px; }
			.toolbar { flex-direction: column; align-items: stretch; margin: 16px; }
			#tableWrap { margin: 0 0 24px; overflow-x: auto; }
			.note { margin: 0 16px 12px; }
		}
	</style>
</head>
<body data-active-menu="markets">
	<div class="sidebar">
		<div class="sidebar-header">
			<img src="/icons/icon_128.png" alt="Freshly.lb Logo" class="sidebar-logo" />
			<h2>Freshly.lb Admin</h2>
			<p>Management Dashboard</p>
			<span id="sidebar-role-badge" class="sidebar-role-badge" style="display:none;"></span>
		</div>
		<ul class="sidebar-menu" id="admin-sidebar-menu"></ul>
	</div>

	<div class="main-content">
		<div class="container">
			<div class="page-header">
				<div class="brand-name">Freshly.lb</div>
				<h1 id="title">🛒 Market Orders</h1>
				<p>Read-only list of orders linked to this market.</p>
			</div>

			<div class="toolbar">
				<a id="backLink" href="/markets" class="btn secondary">← Back to manage</a>
				<div style="display:flex; gap:8px; flex-wrap:wrap;">
					<select id="statusFilter">
						<option value="">All statuses</option>
						<option value="pending">Pending</option>
						<option value="confirmed">Confirmed</option>
						<option value="preparing">Preparing</option>
						<option value="out-for-delivery">Out for delivery</option>
						<option value="delivered">Delivered</option>
						<option value="cancelled">Cancelled</option>
					</select>
				</div>
			</div>

			<div class="note">View only — orders cannot be edited from this page.</div>

			<div id="tableWrap">
				<table>
					<thead>
						<tr>
							<th>Order #</th>
							<th>Customer</th>
							<th>Items</th>
							<th>Total</th>
							<th>Payment</th>
							<th>Status</th>
							<th>Date</th>
						</tr>
					</thead>
					<tbody id="tbody">
						<tr><td colspan="7" class="empty">Loading…</td></tr>
					</tbody>
				</table>
			</div>

			<div class="pagination" id="pagination"></div>
		</div>
	</div>

	<div class="toast" id="toast"></div>

	<script src="js/admin-sidebar.js"></script>
	<script>
		const API = (path) => `/api${path}`;
		const fmt = (n) => `$${Number(n||0).toFixed(2)}`;
		let currentToken = localStorage.getItem('authToken') || localStorage.getItem('token');
		let currentRefreshToken = localStorage.getItem('refreshToken');
		const params = new URLSearchParams(location.search);
		const marketId = params.get('id');
		let currentPage = 1;

		function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
		function redirectToSignIn() { location.href = '/signin'; }
		function clearTokens() { currentToken = null; currentRefreshToken = null; localStorage.removeItem('authToken'); localStorage.removeItem('refreshToken'); localStorage.removeItem('token'); }
		function logout() { clearTokens(); location.href = '/signin'; }
		function authHeaders() { return { 'Content-Type': 'application/json', Authorization: `Bearer ${currentToken}` }; }
		function toast(msg, isErr) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('error', !!isErr); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
		function updateTokens(token, refreshToken) { currentToken = token; currentRefreshToken = refreshToken; localStorage.setItem('authToken', token); if (refreshToken) localStorage.setItem('refreshToken', refreshToken); }

		async function refreshAuthToken() {
			if (!currentRefreshToken) return null;
			try {
				const r = await fetch(API('/auth/refresh'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: currentRefreshToken }) });
				if (!r.ok) return null;
				const data = await r.json();
				updateTokens(data.data.token, data.data.refreshToken);
				return data.data.token;
			} catch { return null; }
		}

		async function authenticatedFetch(url, options = {}) {
			options.headers = { ...(options.headers || {}), ...authHeaders() };
			let response = await fetch(url, options);
			if (response.status === 401 && currentRefreshToken) {
				const t = await refreshAuthToken();
				if (t) { options.headers = { ...(options.headers || {}), ...authHeaders() }; response = await fetch(url, options); }
			}
			return response;
		}

		async function requireAdminAccess() {
			if (!currentToken) { const t = await refreshAuthToken(); if (!t) { clearTokens(); redirectToSignIn(); return false; } }
			try {
				const r = await authenticatedFetch(API('/auth/me'));
				if (r.status === 401) { clearTokens(); redirectToSignIn(); return false; }
				const data = await r.json();
				const user = data?.data?.user;
				setSidebarRoleBadge(user?.role);
				if (!r.ok || user?.role !== 'admin') {
					toast('Only main admins can access this page.', true);
					setTimeout(() => { location.href = '/dashboard'; }, 1500);
					return false;
				}
				return true;
			} catch { toast('Unable to verify admin access.', true); return false; }
		}

		const ROLE_LABELS = {
			admin: 'Admin', manager: 'Manager', staff: 'Staff', rider: 'Rider',
			customer: 'Customer', market: 'Market Owner',
			market_manager: 'Market Manager', market_staff: 'Market Staff',
			market_driver: 'Market Driver',
		};
		function setSidebarRoleBadge(role) {
			const el = document.getElementById('sidebar-role-badge');
			if (!el || !role) return;
			el.textContent = ROLE_LABELS[role] || String(role).toUpperCase();
			el.className = 'sidebar-role-badge role-' + role;
			el.style.display = '';
		}

		async function loadMarketHeader() {
			try {
				const r = await authenticatedFetch(API(`/markets/${marketId}`));
				const j = await r.json();
				if (j.success) {
					document.getElementById('title').textContent = `🛒 ${j.data.name} — Orders`;
					document.title = `${j.data.name} — Orders`;
				}
			} catch {}
		}

		async function loadOrders() {
			const status = document.getElementById('statusFilter').value;
			const qs = new URLSearchParams({ market: marketId, page: currentPage, limit: 20 });
			if (status) qs.set('status', status);
			try {
				const r = await authenticatedFetch(API(`/orders?${qs.toString()}`));
				const j = await r.json();
				if (!j.success) throw new Error(j.message || 'Failed to load orders');
				renderOrders(j.data || []);
				renderPagination(j.pagination || j.meta || {});
			} catch (e) { toast(e.message, true); }
		}

		function renderOrders(list) {
			const tbody = document.getElementById('tbody');
			if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">No orders for this market.</td></tr>'; return; }
			tbody.innerHTML = list.map(o => {
				const num = o.orderNumber || o._id?.slice(-6) || '—';
				const customer = o.customer?.name || o.user?.name || o.customerName || '—';
				const items = Array.isArray(o.items) ? o.items.length : (o.itemsCount ?? 0);
				const total = o.total ?? o.totalAmount ?? 0;
				const payment = o.paymentMethod || o.payment?.method || '—';
				const status = o.status || 'pending';
				const date = o.createdAt ? new Date(o.createdAt).toLocaleString() : '—';
				return `
					<tr>
						<td><code>#${escapeHtml(num)}</code></td>
						<td>${escapeHtml(customer)}</td>
						<td>${escapeHtml(items)}</td>
						<td>${fmt(total)}</td>
						<td>${escapeHtml(payment)}</td>
						<td><span class="badge ${escapeHtml(status)}">${escapeHtml(String(status).replace(/[-_]/g, ' '))}</span></td>
						<td>${escapeHtml(date)}</td>
					</tr>
				`;
			}).join('');
		}

		function renderPagination(p) {
			const total = p.totalPages || p.pages || 1;
			const cur = p.currentPage || p.page || currentPage;
			if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
			let html = `<button ${cur <= 1 ? 'disabled' : ''} onclick="gotoPage(${cur - 1})">‹ Prev</button>`;
			html += `<button class="active" disabled>Page ${cur} / ${total}</button>`;
			html += `<button ${cur >= total ? 'disabled' : ''} onclick="gotoPage(${cur + 1})">Next ›</button>`;
			document.getElementById('pagination').innerHTML = html;
		}

		function gotoPage(p) { currentPage = p; loadOrders(); }

		document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; loadOrders(); });

		(async function init() {
			if (!marketId) { toast('Missing market id', true); setTimeout(() => location.href = '/markets', 1200); return; }
			document.getElementById('backLink').href = `/market-manage?id=${encodeURIComponent(marketId)}`;
			if (await requireAdminAccess()) { loadMarketHeader(); loadOrders(); }
		})();
	</script>
</body>
</html>
