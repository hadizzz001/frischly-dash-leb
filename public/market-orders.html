<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Market Orders — Freshly.lb Admin</title>
	<link rel="stylesheet" href="css/market-orders.css" />
</head>
<body data-active-menu="markets">
	<div class="sidebar">
		<div class="sidebar-header">
			<img src="/icons/icon_128.png" alt="Freshly.lb Logo" class="sidebar-logo" />
			<h2>Freshly.lb Admin</h2>
			<p>Management Dashboard</p>
			<span id="sidebar-role-badge" class="sidebar-role-badge hidden"></span>
		</div>
		<ul class="sidebar-menu" id="admin-sidebar-menu"></ul>
	</div>

	<div class="main-content">
		<div class="container">
			<div class="page-header">
				<div class="brand-name">Freshly.lb</div>
				<h1 id="title">🛒 Market Orders</h1>
				<p>Read-only list of orders linked to this market.</p>
			</div>

			<div class="toolbar">
				<a id="backLink" href="/markets" class="btn secondary">← Back to manage</a>
				<div class="toolbar-filters">
					<select id="statusFilter">
						<option value="">All statuses</option>
						<option value="pending">Pending</option>
						<option value="confirmed">Confirmed</option>
						<option value="preparing">Preparing</option>
						<option value="out-for-delivery">Out for delivery</option>
						<option value="delivered">Delivered</option>
						<option value="cancelled">Cancelled</option>
					</select>
				</div>
			</div>

			<div class="note">View only — orders cannot be edited from this page.</div>

			<div id="tableWrap">
				<table>
					<thead>
						<tr>
							<th>Order #</th>
							<th>Customer</th>
							<th>Items</th>
							<th>Total</th>
							<th>Payment</th>
							<th>Status</th>
							<th>Date</th>
						</tr>
					</thead>
					<tbody id="tbody">
						<tr><td colspan="7" class="empty">Loading…</td></tr>
					</tbody>
				</table>
			</div>

			<div class="pagination" id="pagination"></div>
		</div>
	</div>

	<div class="toast" id="toast"></div>

	<script src="js/admin-sidebar.js"></script>
	<script src="js/page-market-orders.js"></script>
</body>
</html>
