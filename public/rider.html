<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rider Dashboard - FRISCHLY Server</title>

		<!-- Favicon -->
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

		<!-- Font Awesome -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: #f8f9fa;
				color: #333;
				line-height: 1.6;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}

			.header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 30px 0;
				border-radius: 12px;
				margin-bottom: 30px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			}

			.header h1 {
				text-align: center;
				font-size: 2.5rem;
				margin-bottom: 10px;
			}

			.header p {
				text-align: center;
				font-size: 1.1rem;
				opacity: 0.9;
			}

			.stats-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
				gap: 20px;
				margin-bottom: 30px;
			}

			.stat-card {
				background: white;
				padding: 25px;
				border-radius: 12px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
				text-align: center;
				transition: transform 0.3s ease;
			}

			.stat-card:hover {
				transform: translateY(-5px);
			}

			.stat-card .icon {
				font-size: 3rem;
				margin-bottom: 15px;
				color: #667eea;
			}

			.stat-card .value {
				font-size: 2.5rem;
				font-weight: bold;
				color: #333;
				margin-bottom: 5px;
			}

			.stat-card .label {
				color: #666;
				font-size: 1rem;
				text-transform: uppercase;
				letter-spacing: 1px;
			}

			.orders-section {
				background: white;
				border-radius: 12px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
				overflow: hidden;
				margin-bottom: 30px;
			}

			.section-header {
				background: #f8f9fa;
				padding: 20px 25px;
				border-bottom: 1px solid #e9ecef;
			}

			.section-header h2 {
				color: #333;
				margin-bottom: 5px;
			}

			.section-header p {
				color: #666;
				font-size: 0.9rem;
			}

			.section-actions {
				padding: 20px 25px;
				background: #f8f9fa;
				border-bottom: 1px solid #e9ecef;
				display: flex;
				gap: 15px;
				flex-wrap: wrap;
			}

			.btn {
				padding: 10px 20px;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				font-size: 0.9rem;
				font-weight: 500;
				text-decoration: none;
				display: inline-flex;
				align-items: center;
				gap: 8px;
				transition: all 0.3s ease;
			}

			.btn-primary {
				background: #667eea;
				color: white;
			}

			.btn-primary:hover {
				background: #5a67d8;
				transform: translateY(-2px);
			}

			.btn-secondary {
				background: #6c757d;
				color: white;
			}

			.btn-secondary:hover {
				background: #5a6268;
				transform: translateY(-2px);
			}

			.btn-success {
				background: #28a745;
				color: white;
			}

			.btn-success:hover {
				background: #218838;
				transform: translateY(-2px);
			}

			.btn-info {
				background: #17a2b8;
				color: white;
			}

			.btn-info:hover {
				background: #138496;
				transform: translateY(-2px);
			}

			.table-container {
				overflow-x: auto;
			}

			.orders-table {
				width: 100%;
				border-collapse: collapse;
			}

			.orders-table th,
			.orders-table td {
				padding: 15px;
				text-align: left;
				border-bottom: 1px solid #e9ecef;
			}

			.orders-table th {
				background: #f8f9fa;
				font-weight: 600;
				color: #333;
				position: sticky;
				top: 0;
			}

			.orders-table tbody tr:hover {
				background: #f8f9fa;
			}

			.status-badge {
				padding: 5px 12px;
				border-radius: 20px;
				font-size: 0.8rem;
				font-weight: 500;
				text-transform: uppercase;
			}

			.status-ready {
				background: #d4edda;
				color: #155724;
			}

			.status-in-transit {
				background: #fff3cd;
				color: #856404;
			}

			.status-delivered {
				background: #d1ecf1;
				color: #0c5460;
			}

			.action-btn {
				padding: 6px 12px;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				font-size: 0.8rem;
				margin-right: 5px;
				text-decoration: none;
				display: inline-block;
				transition: all 0.3s ease;
			}

			.action-btn.pickup {
				background: #28a745;
				color: white;
			}

			.action-btn.pickup:hover {
				background: #218838;
			}

			.action-btn.deliver {
				background: #007bff;
				color: white;
			}

			.action-btn.deliver:hover {
				background: #0056b3;
			}

			.action-btn.view {
				background: #6c757d;
				color: white;
			}

			.action-btn.view:hover {
				background: #5a6268;
			}

			.loading {
				text-align: center;
				padding: 40px;
				color: #666;
			}

			.spinner {
				border: 4px solid #f3f3f3;
				border-top: 4px solid #667eea;
				border-radius: 50%;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
				margin: 0 auto 20px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.empty-state {
				text-align: center;
				padding: 60px 20px;
				color: #666;
			}

			.empty-state .icon {
				font-size: 4rem;
				margin-bottom: 20px;
				color: #dee2e6;
			}

			.empty-state h3 {
				margin-bottom: 10px;
				color: #333;
			}

			.message {
				padding: 15px;
				border-radius: 8px;
				margin-bottom: 20px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.message.success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.message.error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
			}

			.message.info {
				background: #d1ecf1;
				color: #0c5460;
				border: 1px solid #bee5eb;
			}

			.close-btn {
				background: none;
				border: none;
				font-size: 1.2rem;
				cursor: pointer;
				color: inherit;
				opacity: 0.7;
			}

			.close-btn:hover {
				opacity: 1;
			}

			/* Modal Styles */
			.modal {
				display: none;
				position: fixed;
				z-index: 1000;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.5);
			}

			.modal-content {
				background: white;
				margin: 5% auto;
				padding: 30px;
				border-radius: 12px;
				width: 90%;
				max-width: 600px;
				max-height: 80vh;
				overflow-y: auto;
			}

			.modal-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 20px;
				padding-bottom: 15px;
				border-bottom: 1px solid #e9ecef;
			}

			.modal-header h2 {
				margin: 0;
				color: #333;
			}

			.close {
				font-size: 2rem;
				cursor: pointer;
				color: #666;
			}

			.close:hover {
				color: #333;
			}

			/* Responsive Design */
			@media (max-width: 768px) {
				.container {
					padding: 10px;
				}

				.header h1 {
					font-size: 2rem;
				}

				.stats-grid {
					grid-template-columns: 1fr;
				}

				.section-actions {
					flex-direction: column;
				}

				.btn {
					width: 100%;
					justify-content: center;
				}

				.orders-table th,
				.orders-table td {
					padding: 10px 8px;
					font-size: 0.9rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1><i class="fas fa-motorcycle"></i> Rider Dashboard</h1>
				<p>Manage your deliveries and track orders</p>
			</div>

			<!-- Messages -->
			<div id="message"></div>

			<!-- Stats Cards -->
			<div class="stats-grid">
				<div class="stat-card">
					<div class="icon">📦</div>
					<div class="value" id="ready-orders">0</div>
					<div class="label">Ready for Pickup</div>
				</div>
				<div class="stat-card">
					<div class="icon">🚚</div>
					<div class="value" id="in-transit-orders">0</div>
					<div class="label">In Transit</div>
				</div>
				<div class="stat-card">
					<div class="icon">✅</div>
					<div class="value" id="delivered-orders">0</div>
					<div class="label">Delivered Today</div>
				</div>
				<div class="stat-card">
					<div class="icon">💰</div>
					<div class="value" id="earnings">€0</div>
					<div class="label">Today's Earnings</div>
				</div>
			</div>

			<!-- Orders Section -->
			<div class="orders-section">
				<div class="section-header">
					<h2>Ready Orders</h2>
					<p>Orders ready for pickup and delivery</p>
				</div>

				<div class="section-actions">
					<button class="btn btn-primary" onclick="loadReadyOrders()">
						<i class="fas fa-sync"></i> Refresh Orders
					</button>
					<button class="btn btn-secondary" onclick="loadMyDeliveries()">
						<i class="fas fa-truck"></i> My Deliveries
					</button>
					<button class="btn btn-info" onclick="updateLocation()">
						<i class="fas fa-map-marker-alt"></i> Update Location
					</button>
					<button class="btn btn-success" onclick="logout()">
						<i class="fas fa-sign-out-alt"></i> Logout
					</button>
				</div>

				<div class="table-container">
					<table class="orders-table">
						<thead>
							<tr>
								<th>Order #</th>
								<th>Customer</th>
								<th>Items</th>
								<th>Total</th>
								<th>Status</th>
								<th>Pickup Time</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody id="orders-table-body">
							<tr>
								<td colspan="7" class="loading">
									<div class="spinner"></div>
									<p>Loading orders...</p>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<!-- Order Details Modal -->
		<div id="order-modal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h2>Order Details</h2>
					<span class="close" onclick="closeModal()">&times;</span>
				</div>
				<div id="order-details-content">
					<!-- Order details will be loaded here -->
				</div>
			</div>
		</div>

		<script>
			// API Configuration
			const API_BASE_URL =
				window.location.hostname === "localhost"
					? "http://localhost:3001/api"
					: `${window.location.protocol}//${window.location.hostname}/api`;

			// Global variables
			let currentToken = localStorage.getItem("authToken");
			let currentRefreshToken = localStorage.getItem("refreshToken");
			let currentRider = null;
			let allOrders = [];

			// Initialize the page
			document.addEventListener("DOMContentLoaded", function () {
				checkAuthentication();
				loadReadyOrders();
			});

			// Check if rider is authenticated
			function checkAuthentication() {
				if (!currentToken) {
					window.location.href = "signin.html";
					return;
				}

				// Verify token and get rider info
				fetch(`${API_BASE_URL}/auth/me`, {
					headers: {
						Authorization: `Bearer ${currentToken}`,
						"Content-Type": "application/json",
					},
				})
					.then(async (response) => {
						if (!response.ok) {
							if (response.status === 401) {
								localStorage.removeItem("authToken");
								localStorage.removeItem("refreshToken");
							}
							window.location.href = "signin.html";
							return;
						}
						return response.json();
					})
					.then((data) => {
						if (data && data.success && data.data.user) {
							const user = data.data.user;
							if (user.role !== "rider") {
								showMessage("Access denied. Rider access only.", "error");
								setTimeout(() => {
									window.location.href = "signin.html";
								}, 2000);
								return;
							}
							currentRider = user;
							updateWelcomeMessage(user);
						} else {
							window.location.href = "signin.html";
						}
					})
					.catch((error) => {
						window.location.href = "signin.html";
					});
			}

			// Function to refresh authentication token
			async function refreshAuthToken() {
				if (!currentRefreshToken) {
					return false;
				}

				try {
					const response = await fetch(`${API_BASE_URL}/auth/refresh`, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify({
							refreshToken: currentRefreshToken,
						}),
					});

					if (response.ok) {
						const data = await response.json();
						if (data.success && data.data.accessToken) {
							currentToken = data.data.accessToken;
							localStorage.setItem("authToken", currentToken);
							return true;
						}
					}

					return false;
				} catch (error) {
					return false;
				}
			}

			// Update welcome message
			function updateWelcomeMessage(user) {
				const header = document.querySelector(".header h1");
				if (header && user) {
					header.innerHTML = `<i class="fas fa-motorcycle"></i> Welcome, ${user.name}`;
				}
			}

			// Load ready orders
			async function loadReadyOrders() {
				showTableLoading(true, "Loading ready orders...");

				try {
					const response = await fetch(
						`${API_BASE_URL}/orders/runningOrder?page=1&limit=10&sortBy=createdAt&sortOrder=desc`,
						{
							headers: {
								Authorization: `Bearer ${currentToken}`,
								"Content-Type": "application/json",
							},
						}
					);

					if (response.ok) {
						const data = await response.json();
						allOrders = data.data || [];
						displayOrders(allOrders);
						updateStats(allOrders);
					} else {
						const errorData = await response.json().catch(() => ({}));

						if (response.status === 403) {
							showMessage(
								"Access denied. Please check your rider permissions or refresh your login.",
								"error"
							);
							// Optionally redirect to login if repeatedly failing
							setTimeout(() => {
								if (confirm("Would you like to sign in again?")) {
									window.location.href = "signin.html";
								}
							}, 3000);
						} else if (response.status === 401) {
							const refreshed = await refreshAuthToken();
							if (refreshed) {
								// Retry the request with new token
								loadReadyOrders();
								return;
							} else {
								showMessage(
									"Authentication failed. Please sign in again.",
									"error"
								);
								localStorage.removeItem("authToken");
								localStorage.removeItem("refreshToken");
								window.location.href = "signin.html";
							}
						} else {
							showMessage(
								`Failed to load orders (${response.status})`,
								"error"
							);
						}
					}
				} catch (error) {
					console.error("Error loading orders:", error);
					showMessage("Error loading orders. Please try again.", "error");
				} finally {
					showTableLoading(false);
				}
			}

			// Load rider's current deliveries
			async function loadMyDeliveries() {
				showTableLoading(true, "Loading your deliveries...");

				try {
					const response = await fetch(
						`${API_BASE_URL}/orders?assignedRider=${
							currentRider._id
						}&status=${encodeURIComponent("OnTheWay")}&limit=50`,
						{
							headers: {
								Authorization: `Bearer ${currentToken}`,
								"Content-Type": "application/json",
							},
						}
					);

					if (response.ok) {
						const data = await response.json();
						const deliveries = data.data || [];
						displayOrders(deliveries);
						showMessage(
							`Found ${deliveries.length} deliveries in progress`,
							"info"
						);
					} else {
						const errorData = await response.json().catch(() => ({}));
						if (response.status === 403) {
							showMessage(
								"Access denied. Please check your rider permissions.",
								"error"
							);
						} else if (response.status === 401) {
							showMessage(
								"Authentication failed. Please sign in again.",
								"error"
							);
							localStorage.removeItem("authToken");
							localStorage.removeItem("refreshToken");
							window.location.href = "signin.html";
						} else {
							showMessage(
								`Failed to load deliveries (${response.status})`,
								"error"
							);
						}
					}
				} catch (error) {
					console.error("Error loading deliveries:", error);
					showMessage("Error loading deliveries. Please try again.", "error");
				} finally {
					showTableLoading(false);
				}
			}

			// Display orders in table
			function displayOrders(orders) {
				const tbody = document.getElementById("orders-table-body");

				if (!orders || orders.length === 0) {
					tbody.innerHTML = `
						<tr>
							<td colspan="7" class="empty-state">
								<div class="icon">📦</div>
								<h3>No orders found</h3>
								<p>No orders match your current view.</p>
							</td>
						</tr>
					`;
					return;
				}

				tbody.innerHTML = "";

				orders.forEach((order) => {
					const customerName = order.customer?.name || "N/A";
					const itemCount = order.items?.length || 0;
					const totalAmount = order.total || 0;
					const status = order.status || "pending";
					const orderDate = new Date(order.createdAt).toLocaleString();

					const row = document.createElement("tr");
					row.innerHTML = `
						<td><strong>${order.orderNumber}</strong></td>
						<td>${customerName}</td>
						<td>${itemCount} item${itemCount !== 1 ? "s" : ""}</td>
						<td>€${totalAmount.toFixed(2)}</td>
						<td><span class="status-badge status-${status
							.toLowerCase()
							.replace(" ", "-")}">${status}</span></td>
						<td>${orderDate}</td>
						<td>
							<button class="action-btn view" onclick="viewOrderDetails('${order._id}')">
								<i class="fas fa-eye"></i> View
							</button>
							${getOrderActionButton(order)}
						</td>
					`;
					tbody.appendChild(row);
				});
			}

			// Get appropriate action button based on order status
			function getOrderActionButton(order) {
				if (order.status === "ready for pickup") {
					return `<button class="action-btn pickup" onclick="pickupOrder('${order._id}')">
						<i class="fas fa-hand-paper"></i> Pick Up
					</button>`;
				} else if (order.status === "On the way") {
					return `<button class="action-btn deliver" onclick="deliverOrder('${order._id}')">
						<i class="fas fa-check"></i> Mark Delivered
					</button>`;
				}
				return "";
			}

			// Update statistics
			function updateStats(orders) {
				const readyOrders = orders.filter(
					(order) => order.status === "ready for pickup"
				).length;
				const inTransitOrders = orders.filter(
					(order) => order.status === "OnTheWay"
				).length;
				const deliveredOrders = orders.filter(
					(order) => order.status === "delivered"
				).length;

				document.getElementById("ready-orders").textContent = readyOrders;
				document.getElementById("in-transit-orders").textContent =
					inTransitOrders;
				document.getElementById("delivered-orders").textContent =
					deliveredOrders;

				// Calculate today's earnings (simplified)
				const todaysEarnings = orders
					.filter((order) => order.status === "delivered")
					.reduce((sum, order) => sum + (order.total || 0), 0);

				document.getElementById(
					"earnings"
				).textContent = `€${todaysEarnings.toFixed(2)}`;
			}

			// Pick up an order
			async function pickupOrder(orderId) {
				if (!confirm("Are you sure you want to pick up this order?")) {
					return;
				}

				try {
					showMessage("Picking up order...", "info");

					const response = await fetch(`${API_BASE_URL}/orders/${orderId}`, {
						method: "PUT",
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
						body: JSON.stringify({
							status: "OnTheWay",
							assignedRider: currentRider._id,
							riderAssignedAt: new Date().toISOString(),
						}),
					});

					if (response.ok) {
						showMessage("Order picked up successfully!", "success");
						loadReadyOrders(); // Refresh the list
					} else {
						const errorData = await response.json();
						showMessage(
							errorData.message || "Failed to pick up order",
							"error"
						);
					}
				} catch (error) {
					console.error("Error picking up order:", error);
					showMessage("Error picking up order. Please try again.", "error");
				}
			}

			// Mark order as delivered
			async function deliverOrder(orderId) {
				if (
					!confirm("Are you sure you want to mark this order as delivered?")
				) {
					return;
				}

				try {
					showMessage("Marking order as delivered...", "info");

					const response = await fetch(`${API_BASE_URL}/orders/${orderId}`, {
						method: "PUT",
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
						body: JSON.stringify({
							status: "delivered",
							deliveryCompletedAt: new Date().toISOString(),
						}),
					});

					if (response.ok) {
						showMessage("Order marked as delivered!", "success");
						loadReadyOrders(); // Refresh the list
					} else {
						const errorData = await response.json();
						showMessage(
							errorData.message || "Failed to mark order as delivered",
							"error"
						);
					}
				} catch (error) {
					console.error("Error delivering order:", error);
					showMessage(
						"Error marking order as delivered. Please try again.",
						"error"
					);
				}
			}

			// View order details
			async function viewOrderDetails(orderId) {
				try {
					const response = await fetch(`${API_BASE_URL}/orders/${orderId}`, {
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
					});

					if (response.ok) {
						const data = await response.json();
						const order = data.data;

						const modal = document.getElementById("order-modal");
						const content = document.getElementById("order-details-content");

						content.innerHTML = `
							<div class="order-info">
								<h3>Order ${order.orderNumber}</h3>
								<p><strong>Customer:</strong> ${order.customer?.name || "N/A"}</p>
								<p><strong>Email:</strong> ${order.customer?.email || "N/A"}</p>
								<p><strong>Phone:</strong> ${order.customer?.phone || "N/A"}</p>
								<p><strong>Status:</strong> <span class="status-badge status-${order.status
									.toLowerCase()
									.replace(" ", "-")}">${order.status}</span></p>
								<p><strong>Total:</strong> €${order.total?.toFixed(2) || "0.00"}</p>
								<p><strong>Order Date:</strong> ${new Date(
									order.createdAt
								).toLocaleString()}</p>
							</div>

							<div class="order-items">
								<h4>Order Items:</h4>
								<ul>
									${
										order.items
											?.map(
												(item) => `
										<li>${item.productName} (x${item.quantity}) - €${
													item.totalPrice?.toFixed(2) || "0.00"
												}</li>
									`
											)
											.join("") || "<li>No items found</li>"
									}
								</ul>
							</div>

							${
								order.customer?.address
									? `
								<div class="delivery-address">
									<h4>Delivery Address:</h4>
									<p>${order.customer.address.street}</p>
									<p>${order.customer.address.city}, ${order.customer.address.state}</p>
									<p>${order.customer.address.country}</p>
								</div>
							`
									: ""
							}
						`;

						modal.style.display = "block";
					} else {
						showMessage("Failed to load order details", "error");
					}
				} catch (error) {
					console.error("Error loading order details:", error);
					showMessage(
						"Error loading order details. Please try again.",
						"error"
					);
				}
			}

			// Close modal
			function closeModal() {
				document.getElementById("order-modal").style.display = "none";
			}

			// Show table loading state
			function showTableLoading(show, message = "Loading...") {
				const tbody = document.getElementById("orders-table-body");
				if (show) {
					tbody.innerHTML = `
						<tr>
							<td colspan="7" class="loading">
								<div class="spinner"></div>
								<p>${message}</p>
							</td>
						</tr>
					`;
				}
			}

			// Show message
			function showMessage(message, type) {
				const messageDiv = document.getElementById("message");

				// Clear any existing timeout
				if (window.messageTimeout) {
					clearTimeout(window.messageTimeout);
				}

				messageDiv.innerHTML = `
					<div class="message ${type}">
						<div class="message-content">${message}</div>
						<button class="close-btn" onclick="closeMessage(this)">×</button>
					</div>`;

				// Auto-hide after 5 seconds
				window.messageTimeout = setTimeout(() => {
					closeMessage(messageDiv.querySelector(".close-btn"));
				}, 5000);
			}

			// Close message
			function closeMessage(button) {
				const messageElement = button.closest(".message");
				messageElement.classList.add("fade-out");

				setTimeout(() => {
					if (messageElement.parentElement) {
						messageElement.parentElement.innerHTML = "";
					}
				}, 300);

				if (window.messageTimeout) {
					clearTimeout(window.messageTimeout);
				}
			}

			// Logout function
			function logout() {
				localStorage.removeItem("authToken");
				localStorage.removeItem("refreshToken");
				showMessage("Logged out successfully. Redirecting...", "success");
				setTimeout(() => {
					window.location.href = "signin.html";
				}, 1500);
			}

			// Update rider location
			async function updateLocation() {
				if (!navigator.geolocation) {
					showMessage("Geolocation is not supported by this browser.", "error");
					return;
				}

				showMessage("Getting your location...", "info");

				navigator.geolocation.getCurrentPosition(
					async (position) => {
						const { latitude, longitude } = position.coords;

						try {
							const response = await fetch(`${API_BASE_URL}/riders/location`, {
								method: "PATCH",
								headers: {
									Authorization: `Bearer ${currentToken}`,
									"Content-Type": "application/json",
								},
								body: JSON.stringify({
									latitude,
									longitude,
								}),
							});

							if (response.ok) {
								showMessage("Location updated successfully!", "success");
							} else {
								const errorData = await response.json();
								showMessage(
									errorData.message || "Failed to update location",
									"error"
								);
							}
						} catch (error) {
							console.error("Error updating location:", error);
							showMessage(
								"Error updating location. Please try again.",
								"error"
							);
						}
					},
					(error) => {
						console.error("Geolocation error:", error);
						let errorMessage = "Unable to get your location.";
						switch (error.code) {
							case error.PERMISSION_DENIED:
								errorMessage =
									"Location access denied. Please enable location permissions.";
								break;
							case error.POSITION_UNAVAILABLE:
								errorMessage = "Location information is unavailable.";
								break;
							case error.TIMEOUT:
								errorMessage = "Location request timed out.";
								break;
						}
						showMessage(errorMessage, "error");
					},
					{
						enableHighAccuracy: true,
						timeout: 10000,
						maximumAge: 300000, // 5 minutes
					}
				);
			}

			// Close modal when clicking outside
			window.onclick = function (event) {
				const modal = document.getElementById("order-modal");
				if (event.target === modal) {
					closeModal();
				}
			};
		</script>
	</body>
</html>
