<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Profile - FRISCHLY Server</title>

		<!-- Favicon -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="icons/favicon_16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="icons/favicon_32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="icons/favicon_48x48.png"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: #000000;
				min-height: 100vh;
				padding: 20px;
			}

			.container {
				max-width: 600px;
				margin: 0 auto;
				background: #ffffff;
				border-radius: 15px;
				box-shadow: 0 15px 35px rgba(255, 195, 0, 0.3);
				overflow: hidden;
				border: 3px solid #ffc300;
			}

			.header {
				background: #ffc300;
				color: #000000;
				padding: 30px;
				text-align: center;
			}

			.header h1 {
				font-size: 28px;
				margin-bottom: 10px;
			}

			.header p {
				font-size: 16px;
				opacity: 0.9;
			}

			.content {
				padding: 40px;
			}

			.profile-section {
				margin-bottom: 30px;
			}

			.profile-section h3 {
				color: #333;
				margin-bottom: 15px;
				font-size: 18px;
				border-bottom: 2px solid #f0f0f0;
				padding-bottom: 8px;
			}

			.profile-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 12px 0;
				border-bottom: 1px solid #f5f5f5;
			}

			.profile-item:last-child {
				border-bottom: none;
			}

			.profile-label {
				font-weight: 600;
				color: #555;
			}

			.profile-value {
				color: #333;
				text-align: right;
				max-width: 60%;
				word-break: break-word;
			}

			.role-badge {
				background: #28a745;
				color: white;
				padding: 4px 12px;
				border-radius: 20px;
				font-size: 12px;
				font-weight: 600;
				text-transform: uppercase;
			}

			.role-badge.rider {
				background: #007bff;
			}

			.role-badge.user {
				background: #6c757d;
			}

			.btn {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 12px 24px;
				border: none;
				border-radius: 8px;
				font-size: 16px;
				cursor: pointer;
				transition: all 0.3s ease;
				text-decoration: none;
				display: inline-block;
				text-align: center;
				margin: 10px 5px;
			}

			.btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
			}

			.btn.logout {
				background: #dc3545;
			}

			.btn.logout:hover {
				background: #c82333;
			}

			.btn.delete {
				background: #dc3545;
			}

			.btn.delete:hover {
				background: #c82333;
			}

			.actions {
				text-align: center;
				margin-top: 30px;
				padding-top: 20px;
				border-top: 1px solid #f0f0f0;
			}

			.message {
				padding: 15px;
				border-radius: 8px;
				margin-bottom: 20px;
				text-align: center;
			}

			.message.success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.message.error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
			}

			.loading {
				text-align: center;
				padding: 40px;
				color: #666;
			}

			.loading::after {
				content: "...";
				animation: dots 1.5s steps(4, end) infinite;
			}

			@keyframes dots {
				0%,
				20% {
					content: ".";
				}
				40% {
					content: "..";
				}
				60% {
					content: "...";
				}
				80%,
				100% {
					content: "";
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>My Profile</h1>
				<p>Welcome to your personal profile</p>
			</div>

			<div class="content">
				<div id="message"></div>

				<div id="loading" class="loading">Loading your profile</div>

				<div id="profile-content" style="display: none">
					<div class="profile-section">
						<h3>Personal Information</h3>
						<div class="profile-item">
							<span class="profile-label">Name:</span>
							<span class="profile-value" id="user-name">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Email:</span>
							<span class="profile-value" id="user-email">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Phone:</span>
							<span class="profile-value" id="user-phone">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Role:</span>
							<span class="profile-value">
								<span class="role-badge" id="user-role">-</span>
							</span>
						</div>
					</div>

					<div class="profile-section">
						<h3>Address Information</h3>
						<div class="profile-item">
							<span class="profile-label">Address:</span>
							<span class="profile-value" id="user-address">-</span>
						</div>
					</div>

					<div class="profile-section">
						<h3>Account Information</h3>
						<div class="profile-item">
							<span class="profile-label">Member Since:</span>
							<span class="profile-value" id="member-since">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Last Login:</span>
							<span class="profile-value" id="last-login">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Account Status:</span>
							<span class="profile-value" id="account-status">-</span>
						</div>
					</div>

					<div class="actions">
						<a href="shop.html" class="btn">← Back to Shop</a>
						<button
							onclick="editProfile()"
							class="btn"
							style="background: #ffc300; color: #000"
						>
							Edit Profile
						</button>
						<button onclick="changePassword()" class="btn">
							Change Password
						</button>
						<button onclick="signOut()" class="btn logout">Sign Out</button>
						<button onclick="deleteAccount()" class="btn delete">
							Delete Account
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Global Config -->
		<script src="js/config.js"></script>

		<script>
			let currentToken = localStorage.getItem("authToken");

			// Check if user is logged in
			if (!currentToken) {
				window.location.href = "signin.html";
			}

			function showMessage(message, type) {
				const messageDiv = document.getElementById("message");
				messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
				setTimeout(() => {
					messageDiv.innerHTML = "";
				}, 5000);
			}

			function showLoading(show) {
				document.getElementById("loading").style.display = show
					? "block"
					: "none";
				document.getElementById("profile-content").style.display = show
					? "none"
					: "block";
			}

			function formatDate(dateString) {
				const date = new Date(dateString);
				return date.toLocaleDateString("en-US", {
					year: "numeric",
					month: "long",
					day: "numeric",
				});
			}

			function formatDateTime(dateString) {
				const date = new Date(dateString);
				return date.toLocaleDateString("en-US", {
					year: "numeric",
					month: "short",
					day: "numeric",
					hour: "2-digit",
					minute: "2-digit",
				});
			}

			// Sign out function
			function signOut() {
				localStorage.removeItem("authToken");
				showMessage("Signed out successfully! Redirecting...", "success");
				setTimeout(() => {
					window.location.href = "index.html";
				}, 1500);
			}

			// Delete account function
			async function deleteAccount() {
				const password = prompt(
					"Please enter your password to confirm account deletion:"
				);
				if (!password) {
					return; // User cancelled
				}

				if (
					!confirm(
						"Are you sure you want to delete your account? This action cannot be undone."
					)
				) {
					return;
				}

				showLoading(true);

				try {
					const response = await fetch(`${API_BASE_URL}/auth/delete-account`, {
						method: "DELETE",
						headers: {
							"Content-Type": "application/json",
							Authorization: `Bearer ${currentToken}`,
						},
						body: JSON.stringify({ password }),
					});

					const data = await response.json();

					if (response.ok) {
						showMessage(
							"Account deleted successfully! Redirecting...",
							"success"
						);
						localStorage.removeItem("authToken");
						setTimeout(() => {
							window.location.href = "index.html";
						}, 2000);
					} else {
						showMessage(data.message || "Failed to delete account", "error");
					}
				} catch (error) {
					console.error("Delete account error:", error);
					showMessage("An error occurred while deleting your account", "error");
				} finally {
					showLoading(false);
				}
			}

			// Edit profile function
			function editProfile() {
				const profileContent = document.getElementById("profile-content");

				// Get current values
				const currentName = document.getElementById("user-name").textContent;
				const currentEmail = document.getElementById("user-email").textContent;
				const currentPhone = document.getElementById("user-phone").textContent;
				const currentAddress =
					document.getElementById("user-address").textContent;

				// Parse address components (assuming format: "street, city, state zipCode, country")
				const addressParts = currentAddress.split(", ");
				const street = addressParts[0] || "";
				const city = addressParts[1] || "";
				const stateZip = addressParts[2] || "";
				const [state, zipCode] = stateZip.split(" ");
				const country = addressParts[3] || "";

				profileContent.innerHTML = `
					<div style="text-align: center; padding: 20px;">
						<h3 style="color: #333; margin-bottom: 20px;">Edit Profile</h3>
						<div style="max-width: 500px; margin: 0 auto;">
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Name:</label>
								<input type="text" id="edit-name" value="${currentName}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Email:</label>
								<input type="email" id="edit-email" value="${currentEmail}" readonly
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; background: #f5f5f5;">
								<small style="color: #666; font-size: 12px;">Email cannot be changed</small>
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Phone:</label>
								<input type="tel" id="edit-phone" value="${currentPhone}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Street Address:</label>
								<input type="text" id="edit-street" value="${street}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">City:</label>
								<input type="text" id="edit-city" value="${city}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">State:</label>
								<input type="text" id="edit-state" value="${state || ""}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">ZIP Code:</label>
								<input type="text" id="edit-zip" value="${zipCode || ""}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 20px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Country:</label>
								<input type="text" id="edit-country" value="${country}" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Cardholder Name:</label>
								<input type="text" id="edit-cardholder" value="" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Card Number:</label>
								<input type="text" id="edit-cardnumber" value="" placeholder="1234 5678 9012 3456"
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="display: flex; gap: 10px; margin-bottom: 15px;">
								<div style="flex: 1; text-align: left;">
									<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Expiry Month:</label>
									<select id="edit-expmonth" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
										<option value="">MM</option>
										<option value="01">01</option>
										<option value="02">02</option>
										<option value="03">03</option>
										<option value="04">04</option>
										<option value="05">05</option>
										<option value="06">06</option>
										<option value="07">07</option>
										<option value="08">08</option>
										<option value="09">09</option>
										<option value="10">10</option>
										<option value="11">11</option>
										<option value="12">12</option>
									</select>
								</div>
								<div style="flex: 1; text-align: left;">
									<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Expiry Year:</label>
									<select id="edit-expyear" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
										<option value="">YYYY</option>
										${Array.from({ length: 10 }, (_, i) => {
											const year = new Date().getFullYear() + i;
											return `<option value="${year}">${year}</option>`;
										}).join("")}
									</select>
								</div>
							</div>
							<div style="margin-bottom: 20px; text-align: left;">
								<label style="display: block; margin-bottom: 5px; font-weight: 600; color: #555;">Card Type:</label>
								<select id="edit-cardtype" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
									<option value="other">Select Card Type</option>
									<option value="visa">Visa</option>
									<option value="mastercard">Mastercard</option>
									<option value="amex">American Express</option>
									<option value="discover">Discover</option>
									<option value="other">Other</option>
								</select>
							</div>
							<div style="display: flex; gap: 10px; justify-content: center;">
								<button onclick="saveProfile()" class="btn" style="background: #28a745;">Save Changes</button>
								<button onclick="window.location.reload()" class="btn" style="background: #6c757d;">Cancel</button>
							</div>
						</div>
					</div>
				`;
			}

			// Save profile changes
			async function saveProfile() {
				const name = document.getElementById("edit-name").value.trim();
				const phoneNumber = document.getElementById("edit-phone").value.trim();
				const street = document.getElementById("edit-street").value.trim();
				const city = document.getElementById("edit-city").value.trim();
				const state = document.getElementById("edit-state").value.trim();
				const zipCode = document.getElementById("edit-zip").value.trim();
				const country = document.getElementById("edit-country").value.trim();

				// Credit card information
				const cardholderName = document
					.getElementById("edit-cardholder")
					.value.trim();
				const cardNumber = document
					.getElementById("edit-cardnumber")
					.value.trim()
					.replace(/\s/g, "");
				const expiryMonth = document.getElementById("edit-expmonth").value;
				const expiryYear = document.getElementById("edit-expyear").value;
				const cardType = document.getElementById("edit-cardtype").value;

				// Validation
				if (!name) {
					showMessage("Name is required", "error");
					return;
				}

				if (!street || !city || !zipCode || !country) {
					showMessage("All address fields are required", "error");
					return;
				}

				// Credit card validation (optional)
				if (cardNumber && !/^\d{13,19}$/.test(cardNumber)) {
					showMessage("Please enter a valid card number", "error");
					return;
				}

				if (cardNumber && (!expiryMonth || !expiryYear)) {
					showMessage("Please select expiry month and year", "error");
					return;
				}

				try {
					const updateData = {
						name,
						phoneNumber,
						address: {
							street,
							city,
							state,
							zipCode,
							country,
						},
					};

					// Add credit card data if provided
					if (cardNumber || cardholderName) {
						updateData.creditCard = {
							holderName: cardholderName,
							cardNumber: cardNumber,
							expiryMonth: expiryMonth,
							expiryYear: expiryYear,

							cardType: cardType,
						};
					}

					const response = await fetch(`${API_BASE_URL}/auth/profile`, {
						method: "PUT",
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
						body: JSON.stringify(updateData),
					});

					if (response.ok) {
						showMessage("Profile updated successfully!", "success");
						setTimeout(() => {
							window.location.reload(); // Refresh the page to show updated data
						}, 2000);
					} else {
						const errorData = await response.json();
						showMessage(
							errorData.message || "Failed to update profile",
							"error"
						);
					}
				} catch (error) {
					showMessage("Failed to update profile. Please try again.", "error");
				}
			}

			// Change password function
			function changePassword() {
				// Show password change form
				const profileContent = document.getElementById("profile-content");
				profileContent.innerHTML = `
					<div style="text-align: center; padding: 20px;">
						<h3 style="color: #333; margin-bottom: 20px;">Change Password</h3>
						<div style="max-width: 400px; margin: 0 auto;">
							<div style="margin-bottom: 15px;">
								<input type="password" id="current-password" placeholder="Current Password" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 15px;">
								<input type="password" id="new-password" placeholder="New Password" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="margin-bottom: 20px;">
								<input type="password" id="confirm-password" placeholder="Confirm New Password" 
									style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
							</div>
							<div style="display: flex; gap: 10px; justify-content: center;">
								<button onclick="submitPasswordChange()" class="btn" style="background: #28a745;">Update Password</button>
								<button onclick="window.location.reload()" class="btn" style="background: #6c757d;">Back to Profile</button>
							</div>
						</div>
					</div>
				`;
			}

			// Submit password change
			async function submitPasswordChange() {
				const currentPassword =
					document.getElementById("current-password").value;
				const newPassword = document.getElementById("new-password").value;
				const confirmPassword =
					document.getElementById("confirm-password").value;

				// Validation
				if (!currentPassword || !newPassword || !confirmPassword) {
					showMessage("Please fill in all fields", "error");
					return;
				}

				if (newPassword !== confirmPassword) {
					showMessage("New passwords do not match", "error");
					return;
				}

				if (newPassword.length < 6) {
					showMessage(
						"New password must be at least 6 characters long",
						"error"
					);
					return;
				}

				try {
					const response = await fetch(`${API_BASE_URL}/auth/change-password`, {
						method: "PUT",
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
						body: JSON.stringify({
							currentPassword,
							newPassword,
						}),
					});

					if (response.ok) {
						showMessage("Password changed successfully!", "success");
						setTimeout(() => {
							window.location.reload(); // Refresh the page
						}, 2000);
					} else {
						const errorData = await response.json();
						showMessage(
							errorData.message || "Failed to change password",
							"error"
						);
					}
				} catch (error) {
					showMessage("Failed to change password. Please try again.", "error");
				}
			}

			// Load user profile
			async function loadUserProfile() {
				showLoading(true);

				try {
					const response = await fetch(`${API_BASE_URL}/auth/me`, {
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
					});

					if (response.ok) {
						const data = await response.json();
						const user = data.data.user;

						// Update profile information
						document.getElementById("user-name").textContent = user.name;
						document.getElementById("user-email").textContent = user.email;
						document.getElementById("user-phone").textContent =
							user.phoneNumber;

						// Update role badge
						const roleBadge = document.getElementById("user-role");
						roleBadge.textContent = user.role.toUpperCase();
						roleBadge.className = `role-badge ${user.role}`;

						// Update address
						const addressText = `${user.address.street}, ${user.address.city}, ${user.address.state} ${user.address.zipCode}, ${user.address.country}`;
						document.getElementById("user-address").textContent = addressText;

						// Update account info
						document.getElementById("member-since").textContent = formatDate(
							user.createdAt
						);
						document.getElementById("last-login").textContent = user.lastLogin
							? formatDateTime(user.lastLogin)
							: "First time";
						document.getElementById("account-status").textContent =
							user.isActive ? "Active" : "Inactive";

						showLoading(false);
					} else {
						throw new Error("Failed to load profile");
					}
				} catch (error) {
					showMessage("Failed to load profile. Please try again.", "error");
					showLoading(false);
				}
			}

			// Load profile when page loads
			document.addEventListener("DOMContentLoaded", loadUserProfile);
		</script>
	</body>
</html>
