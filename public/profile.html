<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Profile - FRISCHLY Server</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: #000000;
				min-height: 100vh;
				padding: 20px;
			}

			.container {
				max-width: 600px;
				margin: 0 auto;
				background: #ffffff;
				border-radius: 15px;
				box-shadow: 0 15px 35px rgba(255, 195, 0, 0.3);
				overflow: hidden;
				border: 3px solid #ffc300;
			}

			.header {
				background: #ffc300;
				color: #000000;
				padding: 30px;
				text-align: center;
			}

			.header h1 {
				font-size: 28px;
				margin-bottom: 10px;
			}

			.header p {
				font-size: 16px;
				opacity: 0.9;
			}

			.content {
				padding: 40px;
			}

			.profile-section {
				margin-bottom: 30px;
			}

			.profile-section h3 {
				color: #333;
				margin-bottom: 15px;
				font-size: 18px;
				border-bottom: 2px solid #f0f0f0;
				padding-bottom: 8px;
			}

			.profile-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 12px 0;
				border-bottom: 1px solid #f5f5f5;
			}

			.profile-item:last-child {
				border-bottom: none;
			}

			.profile-label {
				font-weight: 600;
				color: #555;
			}

			.profile-value {
				color: #333;
				text-align: right;
				max-width: 60%;
				word-break: break-word;
			}

			.role-badge {
				background: #28a745;
				color: white;
				padding: 4px 12px;
				border-radius: 20px;
				font-size: 12px;
				font-weight: 600;
				text-transform: uppercase;
			}

			.role-badge.rider {
				background: #007bff;
			}

			.role-badge.user {
				background: #6c757d;
			}

			.btn {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 12px 24px;
				border: none;
				border-radius: 8px;
				font-size: 16px;
				cursor: pointer;
				transition: all 0.3s ease;
				text-decoration: none;
				display: inline-block;
				text-align: center;
				margin: 10px 5px;
			}

			.btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
			}

			.btn.logout {
				background: #dc3545;
			}

			.btn.logout:hover {
				background: #c82333;
			}

			.actions {
				text-align: center;
				margin-top: 30px;
				padding-top: 20px;
				border-top: 1px solid #f0f0f0;
			}

			.message {
				padding: 15px;
				border-radius: 8px;
				margin-bottom: 20px;
				text-align: center;
			}

			.message.success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.message.error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
			}

			.loading {
				text-align: center;
				padding: 40px;
				color: #666;
			}

			.loading::after {
				content: "...";
				animation: dots 1.5s steps(4, end) infinite;
			}

			@keyframes dots {
				0%,
				20% {
					content: ".";
				}
				40% {
					content: "..";
				}
				60% {
					content: "...";
				}
				80%,
				100% {
					content: "";
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>My Profile</h1>
				<p>Welcome to your personal profile</p>
			</div>

			<div class="content">
				<div id="message"></div>

				<div id="loading" class="loading">Loading your profile</div>

				<div id="profile-content" style="display: none">
					<div class="profile-section">
						<h3>Personal Information</h3>
						<div class="profile-item">
							<span class="profile-label">Name:</span>
							<span class="profile-value" id="user-name">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Email:</span>
							<span class="profile-value" id="user-email">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Phone:</span>
							<span class="profile-value" id="user-phone">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Role:</span>
							<span class="profile-value">
								<span class="role-badge" id="user-role">-</span>
							</span>
						</div>
					</div>

					<div class="profile-section">
						<h3>Address Information</h3>
						<div class="profile-item">
							<span class="profile-label">Address:</span>
							<span class="profile-value" id="user-address">-</span>
						</div>
					</div>

					<div class="profile-section">
						<h3>Account Information</h3>
						<div class="profile-item">
							<span class="profile-label">Member Since:</span>
							<span class="profile-value" id="member-since">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Last Login:</span>
							<span class="profile-value" id="last-login">-</span>
						</div>
						<div class="profile-item">
							<span class="profile-label">Account Status:</span>
							<span class="profile-value" id="account-status">-</span>
						</div>
					</div>

					<div class="actions">
						<a href="index.html" class="btn">← Back to Home</a>
						<button onclick="signOut()" class="btn logout">Sign Out</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Global Config -->
		<script src="js/config.js"></script>

		<script>
			let currentToken = localStorage.getItem("authToken");

			// Check if user is logged in
			if (!currentToken) {
				window.location.href = "signin.html";
			}

			function showMessage(message, type) {
				const messageDiv = document.getElementById("message");
				messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
				setTimeout(() => {
					messageDiv.innerHTML = "";
				}, 5000);
			}

			function showLoading(show) {
				document.getElementById("loading").style.display = show
					? "block"
					: "none";
				document.getElementById("profile-content").style.display = show
					? "none"
					: "block";
			}

			function formatDate(dateString) {
				const date = new Date(dateString);
				return date.toLocaleDateString("en-US", {
					year: "numeric",
					month: "long",
					day: "numeric",
				});
			}

			function formatDateTime(dateString) {
				const date = new Date(dateString);
				return date.toLocaleDateString("en-US", {
					year: "numeric",
					month: "short",
					day: "numeric",
					hour: "2-digit",
					minute: "2-digit",
				});
			}

			// Sign out function
			function signOut() {
				localStorage.removeItem("authToken");
				showMessage("Signed out successfully! Redirecting...", "success");
				setTimeout(() => {
					window.location.href = "index.html";
				}, 1500);
			}

			// Load user profile
			async function loadUserProfile() {
				showLoading(true);

				try {
					const response = await fetch(`${API_BASE_URL}/auth/me`, {
						headers: {
							Authorization: `Bearer ${currentToken}`,
							"Content-Type": "application/json",
						},
					});

					if (response.ok) {
						const data = await response.json();
						const user = data.data.user;

						// Update profile information
						document.getElementById("user-name").textContent = user.name;
						document.getElementById("user-email").textContent = user.email;
						document.getElementById("user-phone").textContent =
							user.phoneNumber;

						// Update role badge
						const roleBadge = document.getElementById("user-role");
						roleBadge.textContent = user.role.toUpperCase();
						roleBadge.className = `role-badge ${user.role}`;

						// Update address
						const addressText = `${user.address.street}, ${user.address.city}, ${user.address.state} ${user.address.zipCode}, ${user.address.country}`;
						document.getElementById("user-address").textContent = addressText;

						// Update account info
						document.getElementById("member-since").textContent = formatDate(
							user.createdAt
						);
						document.getElementById("last-login").textContent = user.lastLogin
							? formatDateTime(user.lastLogin)
							: "First time";
						document.getElementById("account-status").textContent =
							user.isActive ? "Active" : "Inactive";

						showLoading(false);
					} else {
						throw new Error("Failed to load profile");
					}
				} catch (error) {
					showMessage("Failed to load profile. Please try again.", "error");
					showLoading(false);
				}
			}

			// Load profile when page loads
			document.addEventListener("DOMContentLoaded", loadUserProfile);
		</script>
	</body>
</html>
