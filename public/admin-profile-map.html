<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Delivery Coverage Regions — Freshly.lb</title>
	<!-- Exact same map stack (OpenLayers + the shared multi-pin widget) used
	     by the market owner's Profile page and the main admin's Markets
	     Management page, so this surface can never drift out of sync. -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
	<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
	<script src="js/region-map-picker.js?v=2"></script>
	<link rel="stylesheet" href="css/profile-map.css" />
</head>
<body>
	<div class="bar">
		<div>
			<h1>📍 Delivery Coverage Regions (Freshly main store)</h1>
			<p>Click the map to drop a pin — add as many as you need. Drag a pin's round center to move it, drag its square handle to resize the coverage circle, and click the red × to remove one.</p>
		</div>
		<button class="btn secondary" onclick="closeMe()">Close</button>
	</div>
	<div id="map"></div>
	<div class="footer">
		<button class="btn secondary" onclick="closeMe()">Cancel</button>
		<button class="btn" onclick="submitRegions()">Save</button>
	</div>
	<div class="toast" id="toast"></div>

	<script src="js/config.js"></script>
	<script src="js/page-admin-profile-map.js"></script>
</body>
</html>
