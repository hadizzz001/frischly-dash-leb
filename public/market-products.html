<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Market Products — Freshly.lb Admin</title>
	<link rel="stylesheet" href="css/market-products.css?v=5" />
	<!-- Global overrides last so they win the cascade (e.g. 40x40 product thumbnails) -->
	<link rel="stylesheet" href="css/global.css?v=5" />
</head>
<body data-active-menu="markets">
	<div class="sidebar">
		<div class="sidebar-header">
			<img src="/icons/icon_128.png" alt="Freshly.lb Logo" class="sidebar-logo" />
			<h2>Freshly.lb Admin</h2>
			<p>Management Dashboard</p>
			<span id="sidebar-role-badge" class="sidebar-role-badge hidden"></span>
		</div>
		<ul class="sidebar-menu" id="admin-sidebar-menu"></ul>
	</div>

	<div class="main-content">
		<div class="container">
			<div class="page-header">
				<div class="brand-name">Freshly.lb</div>
				<h1 id="title">📦 Market Products</h1>
				<p>Read-only list of products linked to this market.</p>
			</div>

			<div class="toolbar">
				<a id="backLink" href="/markets" class="btn secondary">← Back to manage</a>
				<input id="searchInput" placeholder="Search by name…" class="search-input-flex" />
			</div>

			<div class="note">View only — products cannot be edited from this page.</div>

			<div id="tableWrap">
				<table>
					<thead>
						<tr>
							<th>Image</th>
							<th>Name</th>
							<th>Category</th>
							<th>Price</th>
							<th>Stock</th>
							<th>Status</th>
						</tr>
					</thead>
					<tbody id="tbody">
						<tr><td colspan="6" class="empty">Loading…</td></tr>
					</tbody>
				</table>
			</div>

			<div class="pagination" id="pagination"></div>
		</div>
	</div>

	<div class="toast" id="toast"></div>

	<script src="js/admin-sidebar.js"></script>
	<script src="js/page-market-products.js"></script>
</body>
</html>
