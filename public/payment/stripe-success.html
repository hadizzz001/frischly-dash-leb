<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Payment Processing - Freshly</title>
		<link rel="stylesheet" href="../css/payment.css" />
	</head>
	<body>
		<div class="container">
			<div id="loader" class="loader"></div>
			<div id="successIcon" class="success-icon hidden">✓</div>
			<div id="errorIcon" class="error-icon hidden">✕</div>

			<h1 id="title">Processing Payment...</h1>
			<p id="message">
				Please wait while we verify your payment. Do not close this window.
			</p>

			<button
				id="closeBtn"
				onclick="window.location.href=SHOP_URL"
				class="btn hidden"
			>
				Return to Shop
			</button>
		</div>

		<script src="../js/config.js"></script>
		<script src="../js/page-payment-stripe-success.js"></script>
	</body>
</html>
