<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Payment Error - Freshly</title>
		<link rel="stylesheet" href="../css/payment.css" />
	</head>
	<body>
		<div class="container">
			<div class="error-icon">✕</div>
			<h1 class="title-error">Payment Failed</h1>
			<p>
				Unfortunately, your payment could not be processed. Please try again or
				contact support if the problem persists.
			</p>
			<button onclick="window.history.back()" class="btn btn-spaced">Try Again</button>
			<button
				onclick="window.location.href=SHOP_URL"
				class="btn btn-spaced btn-secondary-gray"
			>
				Close
			</button>
		</div>

		<script src="../js/config.js"></script>
		<script src="../js/page-payment-error.js"></script>
	</body>
</html>
