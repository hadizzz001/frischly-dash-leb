<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign In - Freshly Server</title>

		<!-- Favicon -->
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="css/global.css" />
		<link rel="stylesheet" href="css/signin.css" />
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>Welcome Back</h1>
				<p>Sign in to your account</p>
			</div>

			<div id="message"></div>
			<div class="loading" id="loading">
				<div class="spinner"></div>
				<p>Signing you in...</p>
			</div>

			<form id="signin-form">
				<div class="form-group">
					<label for="email">Email or Market Username</label>
					<input
						type="text"
						id="email"
						name="email"
						required
						placeholder="Enter your email or market username"
					/>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<div class="password-wrap">
						<input
							type="password"
							id="password"
							name="password"
							required
							placeholder="Enter your password"
						/>
						<button
							type="button"
							class="password-toggle"
							onclick="togglePassword(this)"
							aria-label="Show password"
							aria-pressed="false"
						>
							<svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
								<circle cx="12" cy="12" r="3" />
							</svg>
							<svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
								<line x1="1" y1="1" x2="23" y2="23" />
							</svg>
						</button>
					</div>
				</div>

				<button type="submit" class="btn">Sign In</button>
			</form>

			<div class="divider">─────── or ───────</div>

			<div class="links">
				<p class="text-muted-gray">
					Forgot your password?
					<a
						href="forgot-password.html"
						class="link-yellow"
						>Reset it here</a
					>
				</p>
				<p><a href="index.html">← Back to Home</a></p>
			</div>
		</div>

		<!-- Global Config -->
		<script src="js/config.js"></script>

		<script src="js/page-signin.js"></script>
	</body>
</html>
